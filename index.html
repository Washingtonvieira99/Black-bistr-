 <button onClick={salvar} className="w-full py-3 rounded-lg bg-amber-400 text-black font-bold text-sm mt-1">Salvar</button>

function BlackBistroSistema(){
 const [loading,setLoading]=useState(true),[erro,setErro]=useState(null),[tab,setTab]=useState('painel');
 const [produtos,setProdutos]=useState([]),[mesas,setMesas]=useState([]),[vendas,setVendas]=useState([]),[movimentacoes,setMovimentacoes]=useState([]);
 const [mesaAbertaId,setMesaAbertaId]=useState(null),[buscaProduto,setBuscaProduto]=useState(''),[categoriaFiltro,setCategoriaFiltro]=useState('Todas');
 const [modalProduto,setModalProduto]=useState(null),[modalMovimento,setModalMovimento]=useState(null),[confirmReset,setConfirmReset]=useState(false);
 const [histSubTab,setHistSubTab]=useState('vendas'),[histSomenteHoje,setHistSomenteHoje]=useState(false);
 useEffect(()=>{hidratar()},[]);

 async function hidratar(){
  let p=storageGet('produtos');if(!p){p=DEFAULT_PRODUCTS;storageSet('produtos',p)}
  let m=storageGet('mesas');if(!m){m=novasMesas(N_MESAS_INICIAL);storageSet('mesas',m)}
  let v=storageGet('vendas')||[],mv=storageGet('estoque_mov')||[];
  setProdutos(p);setMesas(m);setVendas(v);setMovimentacoes(mv);setLoading(false);
 }
 function persistAll(updates){
  const results=[];if(updates.produtos){setProdutos(updates.produtos);results.push(storageSet('produtos',updates.produtos))}
  if(updates.mesas){setMesas(updates.mesas);results.push(storageSet('mesas',updates.mesas))}

  if(updates.movimentacoes){setMovimentacoes(updates.movimentacoes);results.push(storageSet('estoque_mov',updates.movimentacoes))}
  if(results.some(r=>r===false))setErro('Algumas alterações não puderam ser salvas.');
 }
 function abrirMesa(id){persistAll({mesas:mesas.map(m=>m.id===id?{...m,status:'aberta',abertaEm:Date.now()}:m)})}
 function cancelarAberturaMesa(id){persistAll({mesas:mesas.map(m=>m.id===id?{...m,status:'livre',abertaEm:null,itens:[]}:m)});setMesaAbertaId(null)}
 function addItem(mesaId,produto){persistAll({mesas:mesas.map(m=>{if(m.id!==mesaId)return m;const itens=[...m.itens],idx=itens.findIndex(i=>i.produtoId===produto.id);if(idx>=0)itens[idx]={...itens[idx],qtd:itens[idx].qtd+1};else itens.push({produtoId:produto.id,nome:produto.nome,preco:produto.preco,qtd:1});return {...m,itens}})})}
 function mudarQtd(mesaId,produtoId,delta){persistAll({mesas:mesas.map(m=>m.id!==mesaId?m:{...m,itens:m.itens.map(i=>i.produtoId===produtoId?{...i,qtd:i.qtd+delta}:i).filter(i=>i.qtd>0)})})}
 function fecharMesa(mesaId){const mesa=mesas.find(m=>m.id===mesaId);if(!mesa||!mesa.itens.length)return;const total=mesa.itens.reduce((s,i)=>s+i.preco*i.qtd,0);const venda={id:uid('venda'),mesaNumero:mesa.numero,itens:mesa.itens,total,abertaEm:mesa.abertaEm,fechadaEm:Date.now()};const movs=[];const novosProdutos=produtos.map(p=>{const item=mesa.itens.find(i=>i.produtoId===p.id);if(item&&p.estoque!=null){const novo=Math.max(0,p.estoque-item.qtd);movs.push({id:uid('mov'),produtoId:p.id,produtoNome:p.nome,tipo:'saida',motivo:'Venda Mesa '+mesa.numero,qtd:item.qtd,data:Date.now()});return {...p,estoque:novo} }return p});persistAll({mesas:mesas.map(m=>m.id===mesaId?{...m,status:'livre',itens:[],abertaEm:null}:m),vendas:[venda,...vendas],produtos:movs.length?novosProdutos:produtos,movimentacoes:movs.length?[...movs,...movimentacoes]:movimentacoes});setMesaAbertaId(null)}

  {tab==='historico'&&<div className="p-4"><h2 className="font-bold text-lg mb-3">Histórico</h2><div className="flex gap-2 mb-4"><button onClick={()=>setHistSubTab('vendas')} className={'flex-1 py-2 rounded-lg text-sm font-medium '+(histSubTab==='vendas'?'bg-amber-400 text-black':'bg-zinc-900 text-zinc-400')}>Vendas</button><button onClick={()=>setHistSubTab('estoque')} className={'flex-1 py-2 rounded-lg text-sm font-medium '+(histSubTab==='estoque'?'bg-amber-400 text-black':'bg-zinc-900 text-zinc-400')}>Estoque</button></div>
   {histSubTab==='vendas'?<><label className="flex items-center gap-2 text-sm text-zinc-400 mb-3"><input type="checkbox" checked={histSomenteHoje} onChange={e=>setHistSomenteHoje(e.target.checked)}/>Somente hoje</label><div className="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 flex items-center justify-between mb-4"><span className="text-sm text-zinc-400">{vendasFiltradas.length} venda(s)</span><span className="font-bold text-amber-400">{formatBRL(totalVendasFiltradas)}</span></div><div className="space-y-2">{vendasFiltradas.map(v=><div key={v.id} className="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2.5"><div className="flex items-center justify-between mb-1"><span className="text-sm font-semibold">Mesa {v.mesaNumero}</span><span className="text-sm font-bold text-amber-400">{formatBRL(v.total)}</span></div><div className="text-xs text-zinc-500 mb-1">{formatDateTime(v.fechadaEm)}</div><div className="text-xs text-zinc-400 truncate">{v.itens.map(i=>`${i.qtd}x ${i.nome}`).join(', ')}</div></div>)}{!vendasFiltradas.length&&<p className="text-center text-zinc-600 text-sm py-8">Nenhuma venda registrada.</p>}</div></>:

class BootErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null}; }
  static getDerivedStateFromError(error){ return {error}; }
  componentDidCatch(error, info){
    var box=document.getElementById('boot-error');
    var text=document.getElementById('boot-error-text');
    if(box&&text){ text.textContent='ERRO DENTRO DO REACT:\n\n'+(error&&error.stack?error.stack:String(error))+'\n\nCOMPONENTE: '+(info&&info.componentStack?info.componentStack:''); box.style.display='block'; }
  }
  render(){
    if(this.state.error){ return React.createElement('div',{style:{padding:'24px',color:'#fca5a5',fontFamily:'Arial',fontSize:'18px'}},'O sistema encontrou um erro ao renderizar. Veja o diagnóstico acima.'); }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BootErrorBoundary,null,React.createElement(BlackBistroSistema)));
</script>

<div id="boot-error" style="display:none;position:fixed;inset:0;z-index:999999;background:#000;color:#fff;padding:24px;font-family:Arial,sans-serif;font-size:17px;line-height:1.45;overflow:auto">
<div style="color:#fbbf24;font-size:24px;font-weight:bold;margin-bottom:12px">BLACK BISTRÔ — diagnóstico</div>
<pre id="boot-error-text" style="white-space:pre-wrap;color:#fca5a5"></pre>
</div>

<script>
(function(){
  function show(msg){
    var b=document.getElementById('boot-error'),t=document.getElementById('boot-error-text');
    if(b&&t){t.textContent=String(msg);b.style.display='block';}
  }
  try {
    if(!window.Babel) throw new Error('Babel não está disponível.');
    if(!window.React || !window.ReactDOM) throw new Error('React ou ReactDOM não está disponível.');

    var source=document.getElementById('black-bistro-source').textContent;

    var result=Babel.transform(source,{
      presets:[['react',{runtime:'classic'}]],
      sourceType:'script'
    });

    if(/\bimport\s+/.test(result.code)){
      throw new Error('O Babel ainda gerou IMPORT. A transformação não está em modo clássico.');
    }

    var fn=new Function('React','ReactDOM','window','document',result.code);
    fn(window.React,window.ReactDOM,window,document);

    setTimeout(function(){
      var root=document.getElementById('root');
      if(root && !root.hasChildNodes()){
        show('O JavaScript foi executado, mas o React não colocou conteúdo no #root.');
      }
    },2000);

  } catch(e) {
    show((e&&e.stack)?e.stack:String(e));
  }
})();
</script>
